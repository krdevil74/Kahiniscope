name: Fresh start for production

# Empty the database so production starts clean: every collection goes except
# `users` (the team, with their approvals and roles) and `settings` (the
# reminder plan, quiet hours and channel switches). Episodes take their roster
# subcollections with them, and each user's advance `balance` is reset to 0
# because the advances it adds up are among what is deleted. Firebase Auth
# accounts are not touched.
#
# Run by hand from the Actions tab, and awkward to run on purpose, like
# purge-collection.yml:
#
#  - it counts first. The default mode deletes nothing and prints what each
#    collection holds.
#  - the project id has to be typed, and has to match.
#  - for the real thing, the word ERASE has to be typed too. There is no
#    undo: Firestore has no recycle bin, and this project has no backups.
#
# What is kept is decided in functions/src/purge.ts (FRESH_START_KEEPS), and
# tested. Everything else that exists is emptied, including any collection
# added after this was written.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Count first. Switch to delete once the counts look right.'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - delete
      confirm:
        description: 'Type the project id to confirm (kahiniscope-5c9ee)'
        required: true
        type: string
      erase:
        description: 'For mode "delete" only: type ERASE'
        required: false
        type: string

concurrency:
  group: purge-collection
  cancel-in-progress: false

jobs:
  fresh-start:
    name: ${{ inputs.mode }} everything but users and settings
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          ERASE: ${{ inputs.erase }}
          MODE: ${{ inputs.mode }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'kahiniscope-5c9ee' }}
        run: |
          if [ "$CONFIRM" != "$FIREBASE_PROJECT" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match the project '$FIREBASE_PROJECT'."
            exit 1
          fi
          if [ "$MODE" = "delete" ] && [ "$ERASE" != "ERASE" ]; then
            echo "::error::Mode is delete but ERASE was not typed. Nothing was deleted."
            exit 1
          fi

      - name: Check for credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. See docs/11-ci-and-deploy.md."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci --prefix functions

      # Which collections are kept is TypeScript, shared and unit tested.
      - name: Build
        run: npm run build --prefix functions

      - name: Write the service account key
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8'))"

      - name: ${{ inputs.mode == 'delete' && 'Empty the database' || 'Count what would go' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'kahiniscope-5c9ee' }}
          PURGE_MODE: ${{ inputs.mode }}
        run: node functions/scripts/fresh-start.mjs

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
