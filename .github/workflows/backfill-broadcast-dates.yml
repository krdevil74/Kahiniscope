name: Backfill broadcast dates

# A one-off, run by hand after the Episodes slate work is deployed.
#
# The Episodes screen filters broadcast episodes by the month they went out,
# and `broadcastAt` is written by the status switch from the moment it is
# deployed. Every episode marked broadcast before then has no such field — and
# a Firestore query ordered by a field skips the documents that lack it, so
# those episodes would be invisible under every month, for ever.
#
# This dates them from their air date, which is the closest true thing there
# is: nobody recorded when they were marked, and the date they were due to air
# is the date they went out, give or take. An episode that already has a
# `broadcastAt` is left alone — that field records when something happened, and
# this does not know better than the switch that wrote it.
#
# Idempotent: running it twice is the same as running it once.
#
# It lives here rather than as a local command because the credentials are
# already here. Running it from a laptop means a service-account key on that
# laptop, and the whole point of the GitHub secret is that there is one copy.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type the project id to confirm (kahiniscope-5c9ee)'
        required: true
        type: string

concurrency:
  group: backfill-broadcast-dates
  cancel-in-progress: false

jobs:
  backfill:
    name: Date the episodes that have already gone out
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      # Writing to the production database wants more than a click. The
      # project id has to be typed, and it has to match the one being written.
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'kahiniscope-5c9ee' }}
        run: |
          if [ "$CONFIRM" != "$FIREBASE_PROJECT" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match the project '$FIREBASE_PROJECT'."
            exit 1
          fi

      - name: Check for credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. See docs/11-ci-and-deploy.md."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci --prefix functions

      - name: Write the service account key
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8'))"

      - name: Backfill
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'kahiniscope-5c9ee' }}
        run: node functions/scripts/backfill-broadcast-dates.mjs

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
