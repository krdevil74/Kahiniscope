name: Purge a collection

# Delete everything in one collection older than one date. Run by hand, from
# the Actions tab, when somebody has decided a particular collection should
# lose its old documents — the request the weekly one-year sweep
# (`purgeOldData`) cannot answer because its window is fixed.
#
# It is deliberately awkward to run:
#
#  - the collection is a dropdown, not a text box. A mistyped collection name
#    is a no-op against Firestore, which is the worst outcome available: it
#    looks like it worked.
#  - it counts first. The default mode deletes nothing, prints what matches
#    and shows the newest documents that would go — the ones a wrong date
#    takes by surprise.
#  - the project id has to be typed, as in every other workflow here that
#    writes to production.
#  - the date cannot be within the last week. Deleting the last few days is
#    not a clean-up, it is deleting the work in progress.
#
# What it will not touch, on purpose: `users` and `settings`. A user document
# is half of an account — the other half is a Firebase Auth record with a
# custom claim — so deleting one by date leaves an account that can sign in
# and has nothing to sign in to. settings/global is one document the whole app
# reads. Neither belongs behind a date box. The list lives in
# functions/src/purge.ts; adding to it is a code change and a review.

on:
  workflow_dispatch:
    inputs:
      collection:
        description: 'Collection to clean up'
        required: true
        type: choice
        options:
          - reminderLog
          - tasks
          - episodes
          - payments
          - advances
      before:
        description: 'Delete documents dated before this day, YYYY-MM-DD (midnight, Asia/Dhaka)'
        required: true
        type: string
      mode:
        description: 'Count first. Switch to delete once the count looks right.'
        required: true
        default: 'dry-run'
        type: choice
        options:
          - dry-run
          - delete
      confirm:
        description: 'Type the project id to confirm (kahiniscope-5c9ee)'
        required: true
        type: string

# One at a time, whatever the collection. Two passes deleting from the same
# database is not something worth reasoning about.
concurrency:
  group: purge-collection
  cancel-in-progress: false

jobs:
  purge:
    name: ${{ inputs.mode }} ${{ inputs.collection }} before ${{ inputs.before }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # Deleting from the production database wants more than a click. The
      # project id has to be typed, and it has to match the one being emptied.
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
          FIREBASE_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'kahiniscope-5c9ee' }}
        run: |
          if [ "$CONFIRM" != "$FIREBASE_PROJECT" ]; then
            echo "::error::Confirmation '$CONFIRM' does not match the project '$FIREBASE_PROJECT'."
            exit 1
          fi

      - name: Check for credentials
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not set. See docs/11-ci-and-deploy.md."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: npm ci --prefix functions

      # The rules about which collections and which dates are allowed are
      # TypeScript, shared with the retention sweep and unit tested, so the
      # script needs them compiled.
      - name: Build
        run: npm run build --prefix functions

      - name: Write the service account key
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          chmod 600 "$RUNNER_TEMP/sa.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/sa.json','utf8'))"

      - name: ${{ inputs.mode == 'delete' && 'Delete' || 'Count what would go' }}
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          GCLOUD_PROJECT: ${{ vars.FIREBASE_PROJECT_ID || 'kahiniscope-5c9ee' }}
          PURGE_COLLECTION: ${{ inputs.collection }}
          PURGE_BEFORE: ${{ inputs.before }}
          PURGE_MODE: ${{ inputs.mode }}
        run: node functions/scripts/purge-collection.mjs

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
